<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0; background: #000; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; text-align: center; overflow: hidden;
    }
    img { width: 140px; height: 140px; border-radius: 12px; margin-bottom: 10px; }
    h2 { font-size: 15px; margin: 0; width: 85%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    p { font-size: 12px; color: #111; margin: 4px 0 0; color: #b3b3b3; }
    button { padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 20px; border: none; background: #1db954; color: #fff; font-weight: bold; }
  </style>
</head>
<body>
  <div id="content">Loading...</div>

  <script>
    const CLIENT_ID = 'YOUR_SPOTIFY_CLIENT_ID_HERE';
    const REDIRECT_URI = 'http://127.0.0.1:3000/';
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    // PKCE Helper Functions
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    async function redirectToAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      localStorage.setItem('code_verifier', codeVerifier);

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      }).toString();

      window.location.href = authUrl.toString();
    }

    async function getAccessToken(authCode) {
      const codeVerifier = localStorage.getItem('code_verifier');
      const response = await fetch("https://accounts.spotify.com/api/token", {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: authCode,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('access_token', data.access_token);
        window.history.replaceState({}, document.title, "/");
        fetchNowPlaying();
      }
    }

    async function fetchNowPlaying() {
      const token = localStorage.getItem('access_token');
      const content = document.getElementById('content');

      if (!token) {
        content.innerHTML = `<button onclick="redirectToAuth()">Log in with Spotify</button>`;
        return;
      }

      try {
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 204 || res.status === 202) {
          content.innerHTML = `<p>Nothing Playing</p>`;
          return;
        }

        if (res.status === 401) {
          localStorage.removeItem('access_token');
          redirectToAuth();
          return;
        }

        const data = await res.json();
        const track = data.item;
        content.innerHTML = `
          <img src="${track.album.images[0].url}" />
          <h2>${track.name}</h2>
          <p>${track.artists.map(a => a.name).join(', ')}</p>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    // Execution Logic
    if (code) {
      getAccessToken(code);
    } else {
      fetchNowPlaying();
      setInterval(fetchNowPlaying, 3000);
    }
  </script>
</body>
</html>
