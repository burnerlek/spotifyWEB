<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kraken Spotify Display</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      height: 100vh;
      width: 100vw;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      border-radius: 50%;
    }

    .widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;

      width: 100%;
      height: 100%;

      padding: 26px 16px 20px;
    }

    /* Album Art */

    .art-wrapper {
      position: relative;

      width: 160px;
      height: 160px;

      border-radius: 26px;
      margin-top: 10px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .art-wrapper img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      border-radius: 26px;
    }

    .track-info {
      width: 84%;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin: 6px 0 2px;
    }

    h2 {
      font-size: 16px;
      font-weight: 700;

      margin: 0;
      width: 100%;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      letter-spacing: -0.3px;
    }

    p {
      font-size: 12px;

      color: rgba(255, 255, 255, 0.65);

      margin: 2px 0 0;
      width: 100%;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress Bar */

    .progress-container {
      width: 68%;

      display: flex;
      flex-direction: column;

      gap: 4px;

      margin-bottom: 16px;
    }

    .bar-background {
      width: 100%;
      height: 4px;

      background: rgba(255, 255, 255, 0.2);

      border-radius: 2px;
      position: relative;
    }

    .bar-fill {
      height: 100%;

      background: #fff;

      border-radius: 2px;

      width: 0%;

      position: relative;
    }

    .bar-fill::after {
      content: '';

      position: absolute;

      right: -4px;
      top: 50%;

      transform: translateY(-50%);

      width: 8px;
      height: 8px;

      background: #fff;

      border-radius: 50%;

      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;

      font-size: 10px;

      color: rgba(255, 255, 255, 0.55);

      font-weight: 600;

      font-variant-numeric: tabular-nums;

      padding: 0 2px;
    }

    button {
      padding: 12px 24px;

      font-size: 13px;

      cursor: pointer;

      border-radius: 24px;

      border: none;

      background: #1db954;
      color: #fff;

      font-weight: 700;
    }
  </style>
</head>

<body>

  <div id="content" class="widget">
    Loading...
  </div>


  <script>

    /*
      ============================
      SPOTIFY CONFIG
      ============================
    */

    const CLIENT_ID =
      '60acf98167984de5820f1a96728ddce6';

    const REDIRECT_URI =
      'https://burnerlek.github.io/spotifyWEB/';

    const SCOPES =
      'user-read-currently-playing user-read-playback-state';


    /*
      ============================
      GET AUTHORIZATION CODE
      ============================
    */

    const params =
      new URLSearchParams(window.location.search);

    const code =
      params.get('code');


    /*
      ============================
      PKCE FUNCTIONS
      ============================
    */

    function generateRandomString(length) {

      const possible =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

      const values =
        crypto.getRandomValues(
          new Uint8Array(length)
        );

      return values.reduce(
        (acc, x) =>
          acc + possible[x % possible.length],
        ""
      );
    }


    async function sha256(plain) {

      const encoder =
        new TextEncoder();

      const data =
        encoder.encode(plain);

      return window.crypto.subtle.digest(
        'SHA-256',
        data
      );
    }


    function base64encode(input) {

      return btoa(
        String.fromCharCode(
          ...new Uint8Array(input)
        )
      )
      .replace(/=/g, '')
      .replace(/\+/g, '-')
      .replace(/\//g, '_');
    }


    /*
      ============================
      LOGIN / REDIRECT TO SPOTIFY
      ============================
    */

    async function redirectToAuth() {

      try {

        console.log(
          "Starting Spotify login..."
        );

        const codeVerifier =
          generateRandomString(64);

        const hashed =
          await sha256(codeVerifier);

        const codeChallenge =
          base64encode(hashed);


        /*
          Save verifier BEFORE redirecting.

          Spotify sends us away and then
          redirects back to this page.
        */

        localStorage.setItem(
          'code_verifier',
          codeVerifier
        );


        const authUrl =
          new URL(
            "https://accounts.spotify.com/authorize"
          );


        authUrl.search =
          new URLSearchParams({

            response_type: 'code',

            client_id: CLIENT_ID,

            scope: SCOPES,

            code_challenge_method: 'S256',

            code_challenge: codeChallenge,

            redirect_uri: REDIRECT_URI

          }).toString();


        console.log(
          "Redirecting to Spotify..."
        );


        window.location.href =
          authUrl.toString();

      }
      catch (err) {

        console.error(
          "Auth redirect error:",
          err
        );

      }
    }


    /*
      ============================
      SHOW LOGIN BUTTON
      ============================
    */

    function clearSessionAndShowLogin() {

      console.log(
        "Showing login screen"
      );


      localStorage.removeItem(
        'access_token'
      );

      localStorage.removeItem(
        'refresh_token'
      );


      const content =
        document.getElementById(
          'content'
        );


      content.innerHTML = `
        <button id="login-btn">
          Log in with Spotify
        </button>
      `;


      document
        .getElementById('login-btn')
        .addEventListener(
          'click',
          () => {

            redirectToAuth();

          }
        );
    }


    /*
      ============================
      EXCHANGE AUTH CODE
      FOR TOKENS
      ============================
    */

    async function getAccessToken(authCode) {

      const codeVerifier =
        localStorage.getItem(
          'code_verifier'
        );


      console.log(
        "Authorization code:",
        authCode
      );

      console.log(
        "Code verifier exists:",
        !!codeVerifier
      );


      /*
        If the verifier disappeared,
        we cannot exchange the code.
      */

      if (!codeVerifier) {

        console.error(
          "No code verifier found."
        );

        clearSessionAndShowLogin();

        return;
      }


      try {

        const response =
          await fetch(
            "https://accounts.spotify.com/api/token",
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                new URLSearchParams({

                  client_id: CLIENT_ID,

                  grant_type:
                    'authorization_code',

                  code: authCode,

                  redirect_uri:
                    REDIRECT_URI,

                  code_verifier:
                    codeVerifier

                })
            }
          );


        const data =
          await response.json();


        console.log(
          "Token response:",
          response.status,
          data
        );


        if (!response.ok) {

          console.error(
            "Token exchange failed:",
            data
          );

          /*
            Keep the error visible
            instead of silently looping.
          */

          clearSessionAndShowLogin();

          return;
        }


        /*
          Save access token
        */

        localStorage.setItem(
          'access_token',
          data.access_token
        );


        /*
          Save refresh token
        */

        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );

        }


        console.log(
          "Login successful!"
        );


        /*
          Remove ?code= from URL
        */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        /*
          Start Spotify display
        */

        fetchNowPlaying();

      }
      catch (err) {

        console.error(
          "Token exchange error:",
          err
        );

      }
    }


    /*
      ============================
      REFRESH ACCESS TOKEN
      ============================
    */

    async function refreshAccessToken() {

      const refreshToken =
        localStorage.getItem(
          'refresh_token'
        );


      if (!refreshToken) {

        console.log(
          "No refresh token found."
        );

        clearSessionAndShowLogin();

        return false;
      }


      try {

        console.log(
          "Refreshing access token..."
        );


        const response =
          await fetch(
            "https://accounts.spotify.com/api/token",
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                new URLSearchParams({

                  client_id: CLIENT_ID,

                  grant_type:
                    'refresh_token',

                  refresh_token:
                    refreshToken

                })
            }
          );


        const data =
          await response.json();


        console.log(
          "Refresh response:",
          response.status,
          data
        );


        if (!response.ok) {

          console.error(
            "Refresh failed:",
            data
          );

          clearSessionAndShowLogin();

          return false;
        }


        /*
          Save new access token
        */

        localStorage.setItem(
          'access_token',
          data.access_token
        );


        /*
          Spotify may rotate
          the refresh token.
        */

        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );

        }


        console.log(
          "Access token refreshed!"
        );


        return true;

      }
      catch (err) {

        console.error(
          "Refresh error:",
          err
        );

        return false;
      }
    }


    /*
      ============================
      FORMAT TIME
      ============================
    */

    function formatTime(ms) {

      const totalSeconds =
        Math.floor(ms / 1000);

      const minutes =
        Math.floor(totalSeconds / 60);

      const seconds =
        totalSeconds % 60;


      return `${minutes}:${
        seconds < 10
          ? '0'
          : ''
      }${seconds}`;
    }


    /*
      ============================
      FETCH CURRENT SONG
      ============================
    */

    async function fetchNowPlaying() {

      const token =
        localStorage.getItem(
          'access_token'
        );


      /*
        No access token.
        Try refreshing first.
      */

      if (!token) {

        const refreshToken =
          localStorage.getItem(
            'refresh_token'
          );


        if (refreshToken) {

          const refreshed =
            await refreshAccessToken();


          if (refreshed) {

            fetchNowPlaying();

          }

          return;
        }


        clearSessionAndShowLogin();

        return;
      }


      try {

        const res =
          await fetch(
            'https://api.spotify.com/v1/me/player/currently-playing',
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        /*
          Token expired.
          Refresh and retry.
        */

        if (res.status === 401) {

          console.log(
            "Access token expired."
          );


          const refreshed =
            await refreshAccessToken();


          if (refreshed) {

            console.log(
              "Retrying Spotify request..."
            );

            fetchNowPlaying();

          }

          return;
        }


        /*
          Nothing currently playing.
        */

        if (
          res.status === 204 ||
          res.status === 202
        ) {

          const content =
            document.getElementById(
              'content'
            );


          content.innerHTML = `

            <div
              class="art-wrapper"
              style="
                background:#1c1c1e;
                display:flex;
                align-items:center;
                justify-content:center;
              "
            >

              <span style="font-size:42px;">
                🎵
              </span>

            </div>


            <div class="track-info">

              <h2>
                Paused
              </h2>

              <p>
                Play a song on Spotify
              </p>

            </div>

          `;


          return;
        }


        /*
          Handle other API errors
        */

        if (!res.ok) {

          const errorData =
            await res.text();


          console.error(
            "Spotify API error:",
            res.status,
            errorData
          );


          return;
        }


        const data =
          await res.json();


        /*
          Extra safety:
          Sometimes Spotify returns
          an unexpected response.
        */

        if (!data.item) {

          console.log(
            "No track item returned."
          );

          return;
        }


        const track =
          data.item;


        const progressMs =
          data.progress_ms || 0;


        const durationMs =
          track.duration_ms;


        const pct =
          (
            (progressMs / durationMs) * 100
          ).toFixed(1);


        const content =
          document.getElementById(
            'content'
          );


        content.innerHTML = `

          <div class="art-wrapper">

            <img
              src="${track.album.images[0].url}"
              alt="Album Art"
            />

          </div>


          <div class="track-info">

            <h2>
              ${track.name}
            </h2>

            <p>
              ${track.artists
                .map(
                  a => a.name
                )
                .join(', ')}
            </p>

          </div>


          <div class="progress-container">

            <div class="bar-background">

              <div
                class="bar-fill"
                style="
                  width: ${pct}%;
                "
              >
              </div>

            </div>


            <div class="time-labels">

              <span>
                ${formatTime(progressMs)}
              </span>

              <span>
                -${formatTime(
                  durationMs - progressMs
                )}
              </span>

            </div>

          </div>

        `;

      }
      catch (err) {

        /*
          IMPORTANT:

          Don't automatically erase
          tokens here.

          A network error should NOT
          force you to log in again.
        */

        console.error(
          "Now playing error:",
          err
        );

      }
    }


    /*
      ============================
      APP STARTUP
      ============================
    */

    if (code) {

      /*
        We just returned from Spotify.
        Exchange code for tokens.
      */

      getAccessToken(code);

    }
    else {

      /*
        Normal startup.

        If we have an access token,
        use it.

        If it's expired,
        fetchNowPlaying() will
        automatically refresh it.
      */

      fetchNowPlaying();


      /*
        Update every second.
      */

      setInterval(
        fetchNowPlaying,
        1000
      );

    }

  </script>

</body>
</html>
