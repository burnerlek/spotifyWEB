<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kraken Spotify Display</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      height: 100vh;
      width: 100vw;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 50%;
    }

    .widget {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;

      text-align: center;

      padding: 26px 16px 20px;
    }


    /* =========================
       SPOTIFY DISPLAY
    ========================== */

    .art-wrapper {
      position: relative;

      width: 160px;
      height: 160px;

      border-radius: 26px;

      margin-top: 10px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .art-wrapper img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 26px;
    }

    .track-info {
      width: 84%;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin: 6px 0 2px;
    }

    h2 {
      font-size: 16px;
      font-weight: 700;

      margin: 0;

      width: 100%;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      letter-spacing: -0.3px;
    }

    p {
      font-size: 12px;

      color: rgba(255, 255, 255, 0.65);

      margin: 2px 0 0;

      width: 100%;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================
       PROGRESS BAR
    ========================== */

    .progress-container {
      width: 68%;

      display: flex;
      flex-direction: column;

      gap: 4px;

      margin-bottom: 16px;
    }

    .bar-background {
      width: 100%;
      height: 4px;

      background: rgba(255, 255, 255, 0.2);

      border-radius: 2px;

      position: relative;
    }

    .bar-fill {
      height: 100%;

      background: #fff;

      border-radius: 2px;

      width: 0%;

      position: relative;
    }

    .bar-fill::after {
      content: '';

      position: absolute;

      right: -4px;
      top: 50%;

      transform: translateY(-50%);

      width: 8px;
      height: 8px;

      background: #fff;

      border-radius: 50%;

      box-shadow:
        0 0 4px rgba(0, 0, 0, 0.5);
    }

    .time-labels {
      display: flex;

      justify-content: space-between;

      font-size: 10px;

      color: rgba(255, 255, 255, 0.55);

      font-weight: 600;

      font-variant-numeric: tabular-nums;

      padding: 0 2px;
    }


    /* =========================
       CLOCK DISPLAY
    ========================== */

    .clock-widget {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding-bottom: 10px;
    }

    .clock-time {
      font-size: 52px;

      font-weight: 700;

      letter-spacing: -2px;

      line-height: 1;

      font-variant-numeric: tabular-nums;
    }

    .clock-ampm {
      font-size: 14px;

      font-weight: 600;

      color: rgba(255, 255, 255, 0.55);

      margin-top: 6px;

      letter-spacing: 1px;
    }

    .clock-day {
      font-size: 18px;

      font-weight: 600;

      margin-top: 20px;
    }

    .clock-date {
      font-size: 13px;

      color: rgba(255, 255, 255, 0.55);

      margin-top: 4px;
    }


    /* =========================
       LOGIN BUTTON
    ========================== */

    button {
      padding: 10px 20px;

      font-size: 12px;

      cursor: pointer;

      border-radius: 20px;

      border: none;

      background: #1db954;

      color: #fff;

      font-weight: 700;
    }

  </style>
</head>


<body>

  <div
    id="content"
    class="widget"
  >
    Loading...
  </div>


  <script>

    /* =========================
       SPOTIFY SETTINGS
    ========================== */

    const CLIENT_ID =
      '60acf98167984de5820f1a96728ddce6';


    const REDIRECT_URI =
      'https://burnerlek.github.io/spotifyWEB/';


    const SCOPES =
      'user-read-currently-playing user-read-playback-state';


    /*
      Ask Spotify every 10 seconds.

      The progress bar moves smoothly
      locally between requests.
    */

    const NORMAL_DELAY = 3000;


    let rateLimitDelay = 30000;

    let isFetching = false;


    /* =========================
       SPOTIFY PROGRESS STATE
    ========================== */

    let currentProgressMs = 0;

    let currentDurationMs = 0;

    let lastSpotifyUpdate = 0;

    let isPlaying = false;

    let animationFrameId = null;


    /* =========================
       CLOCK STATE
    ========================== */

    let clockIntervalId = null;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      params.get('code');


    /* =========================
       PKCE HELPERS
    ========================== */

    function generateRandomString(length) {

      const possible =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';


      const values =
        crypto.getRandomValues(
          new Uint8Array(length)
        );


      return values.reduce(
        (acc, x) =>
          acc +
          possible[
            x % possible.length
          ],
        ''
      );
    }


    async function sha256(plain) {

      const encoder =
        new TextEncoder();


      const data =
        encoder.encode(plain);


      return window.crypto.subtle.digest(
        'SHA-256',
        data
      );
    }


    function base64encode(input) {

      return btoa(
        String.fromCharCode(
          ...new Uint8Array(input)
        )
      )
      .replace(/=/g, '')
      .replace(/\+/g, '-')
      .replace(/\//g, '_');
    }


    /* =========================
       LOGIN
    ========================== */

    async function redirectToAuth() {

      const codeVerifier =
        generateRandomString(64);


      const hashed =
        await sha256(
          codeVerifier
        );


      const codeChallenge =
        base64encode(
          hashed
        );


      localStorage.setItem(
        'code_verifier',
        codeVerifier
      );


      const authUrl =
        new URL(
          'https://accounts.spotify.com/authorize'
        );


      authUrl.search =
        new URLSearchParams({

          response_type:
            'code',

          client_id:
            CLIENT_ID,

          scope:
            SCOPES,

          code_challenge_method:
            'S256',

          code_challenge:
            codeChallenge,

          redirect_uri:
            REDIRECT_URI

        }).toString();


      window.location.href =
        authUrl.toString();
    }


    function showLogin() {

      stopProgressAnimation();

      stopClock();


      const content =
        document.getElementById(
          'content'
        );


      content.innerHTML = `
        <button id="login-button">
          Log in with Spotify
        </button>
      `;


      document
        .getElementById(
          'login-button'
        )
        .addEventListener(
          'click',
          redirectToAuth
        );
    }


    /* =========================
       FIRST TOKEN
    ========================== */

    async function getAccessToken(authCode) {

      const codeVerifier =
        localStorage.getItem(
          'code_verifier'
        );


      if (!codeVerifier) {

        console.error(
          'No code verifier found.'
        );


        showLogin();

        return false;
      }


      try {

        const response =
          await fetch(
            'https://accounts.spotify.com/api/token',
            {

              method: 'POST',

              headers: {

                'Content-Type':
                  'application/x-www-form-urlencoded'

              },

              body:
                new URLSearchParams({

                  client_id:
                    CLIENT_ID,

                  grant_type:
                    'authorization_code',

                  code:
                    authCode,

                  redirect_uri:
                    REDIRECT_URI,

                  code_verifier:
                    codeVerifier

                })

            }
          );


        const data =
          await response.json();


        console.log(
          'Token response:',
          response.status
        );


        if (!response.ok) {

          console.error(
            'Token exchange failed:',
            data
          );


          showLogin();

          return false;
        }


        localStorage.setItem(
          'access_token',
          data.access_token
        );


        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );

        }


        localStorage.removeItem(
          'code_verifier'
        );


        console.log(
          'Login successful!'
        );


        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        return true;

      }
      catch (err) {

        console.error(
          'Token exchange error:',
          err
        );


        return false;
      }
    }


    /* =========================
       REFRESH TOKEN
    ========================== */

    async function refreshAccessToken() {

      const refreshToken =
        localStorage.getItem(
          'refresh_token'
        );


      if (!refreshToken) {

        showLogin();

        return false;
      }


      try {

        const response =
          await fetch(
            'https://accounts.spotify.com/api/token',
            {

              method: 'POST',

              headers: {

                'Content-Type':
                  'application/x-www-form-urlencoded'

              },

              body:
                new URLSearchParams({

                  client_id:
                    CLIENT_ID,

                  grant_type:
                    'refresh_token',

                  refresh_token:
                    refreshToken

                })

            }
          );


        const data =
          await response.json();


        console.log(
          'Refresh response:',
          response.status
        );


        if (!response.ok) {

          localStorage.removeItem(
            'access_token'
          );

          localStorage.removeItem(
            'refresh_token'
          );


          showLogin();

          return false;
        }


        localStorage.setItem(
          'access_token',
          data.access_token
        );


        /*
          Spotify may sometimes return
          a new refresh token.
        */

        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );
        }


        console.log(
          'Access token refreshed!'
        );


        return true;

      }
      catch (err) {

        console.error(
          'Refresh error:',
          err
        );


        return false;
      }
    }


    /* =========================
       TIME FORMAT
    ========================== */

    function formatTime(ms) {

      const totalSeconds =
        Math.floor(
          ms / 1000
        );


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      return `${minutes}:${
        seconds < 10
          ? '0'
          : ''
      }${seconds}`;
    }


    /* =========================
       STOP PROGRESS
    ========================== */

    function stopProgressAnimation() {

      if (animationFrameId) {

        cancelAnimationFrame(
          animationFrameId
        );


        animationFrameId = null;
      }
    }


    /* =========================
       SMOOTH PROGRESS
    ========================== */

    function updateProgressAnimation() {

      const progressBar =
        document.getElementById(
          'progress-bar'
        );


      const currentTime =
        document.getElementById(
          'current-time'
        );


      const remainingTime =
        document.getElementById(
          'remaining-time'
        );


      if (
        !progressBar ||
        !currentTime ||
        !remainingTime
      ) {

        animationFrameId = null;

        return;
      }


      let progress =
        currentProgressMs;


      if (isPlaying) {

        const elapsed =
          Date.now() -
          lastSpotifyUpdate;


        progress =
          currentProgressMs +
          elapsed;
      }


      progress =
        Math.min(
          progress,
          currentDurationMs
        );


      const pct =
        (
          progress /
          currentDurationMs
        ) * 100;


      progressBar.style.width =
        `${pct}%`;


      currentTime.textContent =
        formatTime(progress);


      remainingTime.textContent =
        `-${formatTime(
          Math.max(
            0,
            currentDurationMs -
            progress
          )
        )}`;


      animationFrameId =
        requestAnimationFrame(
          updateProgressAnimation
        );
    }


    function startProgressAnimation() {

      stopProgressAnimation();


      animationFrameId =
        requestAnimationFrame(
          updateProgressAnimation
        );
    }


    /* =========================
       CLOCK
    ========================== */

    function stopClock() {

      if (clockIntervalId) {

        clearInterval(
          clockIntervalId
        );


        clockIntervalId = null;
      }
    }


    function updateClock() {

      const timeElement =
        document.getElementById(
          'clock-time'
        );


      const ampmElement =
        document.getElementById(
          'clock-ampm'
        );


      const dayElement =
        document.getElementById(
          'clock-day'
        );


      const dateElement =
        document.getElementById(
          'clock-date'
        );


      /*
        If the clock isn't currently
        displayed, stop updating.
      */

      if (
        !timeElement ||
        !ampmElement ||
        !dayElement ||
        !dateElement
      ) {

        stopClock();

        return;
      }


      const now =
        new Date();


      let hours =
        now.getHours();


      const minutes =
        now.getMinutes();


      const ampm =
        hours >= 12
          ? 'PM'
          : 'AM';


      hours =
        hours % 12;


      if (hours === 0) {

        hours = 12;
      }


      const formattedMinutes =
        minutes < 10
          ? `0${minutes}`
          : minutes;


      timeElement.textContent =
        `${hours}:${formattedMinutes}`;


      ampmElement.textContent =
        ampm;


      dayElement.textContent =
        now.toLocaleDateString(
          'en-US',
          {
            weekday: 'long'
          }
        );


      dateElement.textContent =
        now.toLocaleDateString(
          'en-US',
          {
            month: 'long',
            day: 'numeric'
          }
        );
    }


    function showClock() {

      stopProgressAnimation();

      stopClock();


      const content =
        document.getElementById(
          'content'
        );


      content.innerHTML = `

        <div class="clock-widget">

          <div
            id="clock-time"
            class="clock-time"
          >
            --:--
          </div>


          <div
            id="clock-ampm"
            class="clock-ampm"
          >
            --
          </div>


          <div
            id="clock-day"
            class="clock-day"
          >
            Loading...
          </div>


          <div
            id="clock-date"
            class="clock-date"
          >
          </div>

        </div>

      `;


      updateClock();


      clockIntervalId =
        setInterval(
          updateClock,
          1000
        );
    }


    /* =========================
       DISPLAY TRACK
    ========================== */

    function showTrack(data) {

      stopClock();


      if (!data.item) {

        showClock();

        return;
      }


      const track =
        data.item;


      currentProgressMs =
        data.progress_ms || 0;


      currentDurationMs =
        track.duration_ms;


      lastSpotifyUpdate =
        Date.now();


      isPlaying =
        data.is_playing === true;


      const pct =
        (
          currentProgressMs /
          currentDurationMs
        ) * 100;


      const content =
        document.getElementById(
          'content'
        );


      content.innerHTML = `

        <div class="art-wrapper">

          <img
            src="${track.album.images[0].url}"
            alt="Album Art"
          >

        </div>


        <div class="track-info">

          <h2>
            ${track.name}
          </h2>

          <p>
            ${track.artists
              .map(
                a => a.name
              )
              .join(', ')}
          </p>

        </div>


        <div class="progress-container">

          <div class="bar-background">

            <div
              id="progress-bar"
              class="bar-fill"
              style="
                width: ${pct}%;
              "
            ></div>

          </div>


          <div class="time-labels">

            <span id="current-time">
              ${formatTime(
                currentProgressMs
              )}
            </span>


            <span id="remaining-time">
              -${formatTime(
                currentDurationMs -
                currentProgressMs
              )}
            </span>

          </div>

        </div>

      `;


      startProgressAnimation();
    }


    /* =========================
       SCHEDULE NEXT FETCH
    ========================== */

    function scheduleNextFetch(delay) {

      setTimeout(
        fetchNowPlaying,
        delay
      );
    }


    /* =========================
       FETCH SPOTIFY
    ========================== */

    async function fetchNowPlaying() {

      if (isFetching) {

        return;
      }


      isFetching = true;


      try {

        let token =
          localStorage.getItem(
            'access_token'
          );


        /*
          If the access token is gone,
          try using the refresh token.
        */

        if (!token) {

          const refreshed =
            await refreshAccessToken();


          if (!refreshed) {

            isFetching = false;

            return;
          }


          token =
            localStorage.getItem(
              'access_token'
            );
        }


        const res =
          await fetch(
            'https://api.spotify.com/v1/me/player/currently-playing',
            {

              headers: {

                Authorization:
                  `Bearer ${token}`

              }

            }
          );


        /* =====================
           RATE LIMITED
        ====================== */

        if (res.status === 429) {

          const retryHeader =
            res.headers.get(
              'Retry-After'
            );


          let waitSeconds =
            Number(
              retryHeader
            );


          if (
            !waitSeconds ||
            waitSeconds <= 0
          ) {

            waitSeconds =
              rateLimitDelay / 1000;
          }


          console.warn(
            `Rate limited. Waiting ${waitSeconds} seconds...`
          );


          /*
            Keep the current display.

            If music was not playing,
            the clock stays visible.
          */


          rateLimitDelay =
            Math.min(
              rateLimitDelay * 2,
              300000
            );


          isFetching = false;


          scheduleNextFetch(
            waitSeconds * 1000
          );


          return;
        }


        /*
          Successful request.
          Reset rate-limit delay.
        */

        rateLimitDelay =
          30000;


        /* =====================
           ACCESS TOKEN EXPIRED
        ====================== */

        if (res.status === 401) {

          console.log(
            'Access token expired.'
          );


          const refreshed =
            await refreshAccessToken();


          isFetching = false;


          if (refreshed) {

            scheduleNextFetch(
              500
            );
          }


          return;
        }


        /* =====================
           NOTHING PLAYING
        ====================== */

        if (
          res.status === 204 ||
          res.status === 202
        ) {

          showClock();


          isFetching = false;


          scheduleNextFetch(
            NORMAL_DELAY
          );


          return;
        }


        /* =====================
           OTHER ERROR
        ====================== */

        if (!res.ok) {

          console.error(
            'Spotify API error:',
            res.status
          );


          /*
            Keep showing whatever
            is currently displayed.
          */

          isFetching = false;


          scheduleNextFetch(
            NORMAL_DELAY
          );


          return;
        }


        /* =====================
           SUCCESS
        ====================== */

        const data =
          await res.json();


        /*
          If Spotify returns no item
          or says playback is paused,
          show the clock.
        */

        if (
          !data.item ||
          data.is_playing !== true
        ) {

          showClock();

        }
        else {

          showTrack(
            data
          );

        }


        isFetching = false;


        scheduleNextFetch(
          NORMAL_DELAY
        );

      }
      catch (err) {

        console.error(
          'Now playing error:',
          err
        );


        isFetching = false;


        scheduleNextFetch(
          30000
        );
      }
    }


    /* =========================
       START APP
    ========================== */

    async function startApp() {

      if (code) {

        const loggedIn =
          await getAccessToken(
            code
          );


        if (loggedIn) {

          fetchNowPlaying();

        }

        return;
      }


      const token =
        localStorage.getItem(
          'access_token'
        );


      const refreshToken =
        localStorage.getItem(
          'refresh_token'
        );


      /*
        No login yet.
      */

      if (
        !token &&
        !refreshToken
      ) {

        showLogin();

        return;
      }


      /*
        Start Spotify checking.

        Until we get the first result,
        show the clock instead of
        "Loading..."
      */

      showClock();

      fetchNowPlaying();
    }


    startApp();

  </script>

</body>
</html>
