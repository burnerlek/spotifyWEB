<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kraken Spotify Display</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
    }

    .widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      width: 100%;
      height: 100%;
      padding: 26px 16px 20px;
    }

    /* Album Art */

    .art-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 26px;
      margin-top: 10px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .art-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 26px;
    }

    .track-info {
      width: 84%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 6px 0 2px;
    }

    h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      margin: 2px 0 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress Bar */

    .progress-container {
      width: 68%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
    }

    .bar-background {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      width: 0%;
      position: relative;
    }

    .bar-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 0 2px;
    }

    button {
      padding: 10px 20px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 20px;
      border: none;
      background: #1db954;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div id="content" class="widget">
    Loading...
  </div>

  <script>

    const CLIENT_ID = '60acf98167984de5820f1a96728ddce6';

    const REDIRECT_URI =
      'https://burnerlek.github.io/spotifyWEB/';

    const SCOPES =
      'user-read-currently-playing user-read-playback-state';


    /*
      Normal time between Spotify requests.

      10 seconds means 6 requests per minute.
    */

    const NORMAL_DELAY = 10000;


    /*
      Used for exponential backoff
      if Spotify rate limits us.
    */

    let rateLimitDelay = 30000;


    /*
      Prevent multiple requests
      from running simultaneously.
    */

    let isFetching = false;


    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      params.get('code');


    /* =========================
       PKCE
    ========================== */

    function generateRandomString(length) {

      const possible =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

      const values =
        crypto.getRandomValues(
          new Uint8Array(length)
        );

      return values.reduce(
        (acc, x) =>
          acc +
          possible[
            x % possible.length
          ],
        ''
      );
    }


    async function sha256(plain) {

      const encoder =
        new TextEncoder();

      const data =
        encoder.encode(plain);

      return window.crypto.subtle.digest(
        'SHA-256',
        data
      );
    }


    function base64encode(input) {

      return btoa(
        String.fromCharCode(
          ...new Uint8Array(input)
        )
      )
      .replace(/=/g, '')
      .replace(/\+/g, '-')
      .replace(/\//g, '_');
    }


    /* =========================
       LOGIN
    ========================== */

    async function redirectToAuth() {

      const codeVerifier =
        generateRandomString(64);

      const hashed =
        await sha256(codeVerifier);

      const codeChallenge =
        base64encode(hashed);


      localStorage.setItem(
        'code_verifier',
        codeVerifier
      );


      const authUrl =
        new URL(
          'https://accounts.spotify.com/authorize'
        );


      authUrl.search =
        new URLSearchParams({

          response_type: 'code',

          client_id: CLIENT_ID,

          scope: SCOPES,

          code_challenge_method: 'S256',

          code_challenge: codeChallenge,

          redirect_uri: REDIRECT_URI

        }).toString();


      window.location.href =
        authUrl.toString();
    }


    function showLogin() {

      const content =
        document.getElementById('content');


      content.innerHTML = `
        <button id="login-button">
          Log in with Spotify
        </button>
      `;


      document
        .getElementById('login-button')
        .addEventListener(
          'click',
          redirectToAuth
        );
    }


    /* =========================
       GET FIRST TOKENS
    ========================== */

    async function getAccessToken(authCode) {

      const codeVerifier =
        localStorage.getItem(
          'code_verifier'
        );


      console.log(
        'Authorization code received:',
        !!authCode
      );


      console.log(
        'Code verifier exists:',
        !!codeVerifier
      );


      if (!codeVerifier) {

        console.error(
          'No code verifier found.'
        );

        showLogin();

        return false;
      }


      try {

        const response =
          await fetch(
            'https://accounts.spotify.com/api/token',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                new URLSearchParams({

                  client_id: CLIENT_ID,

                  grant_type:
                    'authorization_code',

                  code: authCode,

                  redirect_uri:
                    REDIRECT_URI,

                  code_verifier:
                    codeVerifier

                })
            }
          );


        const data =
          await response.json();


        console.log(
          'Token response:',
          response.status
        );


        if (!response.ok) {

          console.error(
            'Token exchange failed:',
            data
          );

          showLogin();

          return false;
        }


        localStorage.setItem(
          'access_token',
          data.access_token
        );


        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );

          console.log(
            'Refresh token saved!'
          );
        }


        localStorage.removeItem(
          'code_verifier'
        );


        console.log(
          'Login successful!'
        );


        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        return true;

      }
      catch (err) {

        console.error(
          'Token exchange error:',
          err
        );

        return false;
      }
    }


    /* =========================
       REFRESH TOKEN
    ========================== */

    async function refreshAccessToken() {

      const refreshToken =
        localStorage.getItem(
          'refresh_token'
        );


      if (!refreshToken) {

        console.log(
          'No refresh token found.'
        );

        showLogin();

        return false;
      }


      try {

        console.log(
          'Refreshing access token...'
        );


        const response =
          await fetch(
            'https://accounts.spotify.com/api/token',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                new URLSearchParams({

                  client_id: CLIENT_ID,

                  grant_type:
                    'refresh_token',

                  refresh_token:
                    refreshToken

                })
            }
          );


        const data =
          await response.json();


        console.log(
          'Refresh response:',
          response.status
        );


        if (!response.ok) {

          console.error(
            'Refresh failed:',
            data
          );


          localStorage.removeItem(
            'access_token'
          );

          localStorage.removeItem(
            'refresh_token'
          );


          showLogin();

          return false;
        }


        localStorage.setItem(
          'access_token',
          data.access_token
        );


        /*
          Save a new refresh token
          if Spotify gives us one.
        */

        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );
        }


        console.log(
          'Access token refreshed!'
        );


        return true;

      }
      catch (err) {

        console.error(
          'Refresh error:',
          err
        );

        return false;
      }
    }


    /* =========================
       FORMAT TIME
    ========================== */

    function formatTime(ms) {

      const totalSeconds =
        Math.floor(ms / 1000);

      const minutes =
        Math.floor(totalSeconds / 60);

      const seconds =
        totalSeconds % 60;

      return `${minutes}:${
        seconds < 10
          ? '0'
          : ''
      }${seconds}`;
    }


    /* =========================
       PAUSED DISPLAY
    ========================== */

    function showPaused() {

      const content =
        document.getElementById('content');


      content.innerHTML = `
        <div
          class="art-wrapper"
          style="
            background:#1c1c1e;
            display:flex;
            align-items:center;
            justify-content:center;
          "
        >
          <span style="font-size:42px;">
            🎵
          </span>
        </div>

        <div class="track-info">
          <h2>Paused</h2>
          <p>Play a song on Spotify</p>
        </div>
      `;
    }


    /* =========================
       SHOW WAITING MESSAGE
    ========================== */

    function showRateLimited(seconds) {

      const content =
        document.getElementById('content');


      content.innerHTML = `
        <div
          class="art-wrapper"
          style="
            background:#1c1c1e;
            display:flex;
            align-items:center;
            justify-content:center;
          "
        >
          <span style="font-size:42px;">
            🎵
          </span>
        </div>

        <div class="track-info">
          <h2>Spotify is busy</h2>
          <p>
            Trying again in ${seconds} seconds...
          </p>
        </div>
      `;
    }


    /* =========================
       DISPLAY SONG
    ========================== */

    function showTrack(data) {

      if (!data.item) {

        showPaused();

        return;
      }


      const track =
        data.item;


      const progressMs =
        data.progress_ms || 0;


      const durationMs =
        track.duration_ms;


      const pct =
        (
          (progressMs / durationMs) *
          100
        ).toFixed(1);


      const content =
        document.getElementById('content');


      content.innerHTML = `
        <div class="art-wrapper">
          <img
            src="${track.album.images[0].url}"
            alt="Album Art"
          >
        </div>

        <div class="track-info">
          <h2>
            ${track.name}
          </h2>

          <p>
            ${track.artists
              .map(a => a.name)
              .join(', ')}
          </p>
        </div>

        <div class="progress-container">

          <div class="bar-background">

            <div
              class="bar-fill"
              style="width: ${pct}%"
            ></div>

          </div>

          <div class="time-labels">

            <span>
              ${formatTime(progressMs)}
            </span>

            <span>
              -${formatTime(
                durationMs - progressMs
              )}
            </span>

          </div>

        </div>
      `;
    }


    /* =========================
       CONTROLLED UPDATE LOOP
    ========================== */

    function scheduleNextFetch(delay) {

      setTimeout(
        fetchNowPlaying,
        delay
      );
    }


    async function fetchNowPlaying() {

      /*
        This should never happen now,
        but keeps us extra safe.
      */

      if (isFetching) {

        console.log(
          'Request already running.'
        );

        return;
      }


      isFetching = true;


      try {

        let token =
          localStorage.getItem(
            'access_token'
          );


        /*
          No access token?

          Try refresh token first.
        */

        if (!token) {

          const refreshed =
            await refreshAccessToken();


          if (!refreshed) {

            isFetching = false;

            return;
          }


          token =
            localStorage.getItem(
              'access_token'
            );
        }


        const res =
          await fetch(
            'https://api.spotify.com/v1/me/player/currently-playing',
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        /* =====================
           RATE LIMITED
        ====================== */

        if (res.status === 429) {

          const retryHeader =
            res.headers.get(
              'Retry-After'
            );


          let waitSeconds =
            Number(retryHeader);


          /*
            If Spotify gives us
            no Retry-After value,
            use our current delay.
          */

          if (
            !waitSeconds ||
            waitSeconds <= 0
          ) {

            waitSeconds =
              rateLimitDelay / 1000;
          }


          console.warn(
            `Rate limited. Waiting ${waitSeconds} seconds...`
          );


          showRateLimited(
            waitSeconds
          );


          /*
            Increase the wait time
            next time if we continue
            getting rate limited.

            30 → 60 → 120 → 240 → 300
          */

          rateLimitDelay =
            Math.min(
              rateLimitDelay * 2,
              300000
            );


          isFetching = false;


          scheduleNextFetch(
            waitSeconds * 1000
          );


          return;
        }


        /*
          Successful request.

          Reset the rate limit delay.
        */

        rateLimitDelay =
          30000;


        /* =====================
           TOKEN EXPIRED
        ====================== */

        if (res.status === 401) {

          console.log(
            'Access token expired.'
          );


          const refreshed =
            await refreshAccessToken();


          isFetching = false;


          if (refreshed) {

            scheduleNextFetch(
              500
            );
          }


          return;
        }


        /* =====================
           NOTHING PLAYING
        ====================== */

        if (
          res.status === 204 ||
          res.status === 202
        ) {

          showPaused();

          isFetching = false;

          scheduleNextFetch(
            NORMAL_DELAY
          );

          return;
        }


        /* =====================
           OTHER ERRORS
        ====================== */

        if (!res.ok) {

          console.error(
            'Spotify API error:',
            res.status
          );


          isFetching = false;


          scheduleNextFetch(
            NORMAL_DELAY
          );

          return;
        }


        /* =====================
           SUCCESS
        ====================== */

        const data =
          await res.json();


        showTrack(data);


        isFetching = false;


        scheduleNextFetch(
          NORMAL_DELAY
        );

      }
      catch (err) {

        console.error(
          'Now playing error:',
          err
        );


        isFetching = false;


        scheduleNextFetch(
          30000
        );
      }
    }


    /* =========================
       START APP
    ========================== */

    async function startApp() {

      if (code) {

        const loggedIn =
          await getAccessToken(code);


        if (loggedIn) {

          fetchNowPlaying();
        }

      }
      else {

        const token =
          localStorage.getItem(
            'access_token'
          );


        const refreshToken =
          localStorage.getItem(
            'refresh_token'
          );


        if (!token && !refreshToken) {

          showLogin();

          return;
        }


        fetchNowPlaying();
      }
    }


    startApp();

  </script>

</body>
</html>
