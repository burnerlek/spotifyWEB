<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kraken Spotify Display</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      height: 100vh;
      width: 100vw;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 50%;
    }


    .widget {
      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: space-between;

      text-align: center;

      width: 100%;
      height: 100%;

      padding: 26px 16px 20px;
    }


    /* Album Art */

    .art-wrapper {
      position: relative;

      width: 160px;
      height: 160px;

      border-radius: 26px;

      margin-top: 10px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.12);
    }


    .art-wrapper img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 26px;
    }


    .track-info {
      width: 84%;

      display: flex;
      flex-direction: column;

      align-items: center;

      margin: 6px 0 2px;
    }


    h2 {
      font-size: 16px;
      font-weight: 700;

      margin: 0;

      width: 100%;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      letter-spacing: -0.3px;
    }


    p {
      font-size: 12px;

      color:
        rgba(255, 255, 255, 0.65);

      margin: 2px 0 0;

      width: 100%;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Progress Bar */

    .progress-container {
      width: 68%;

      display: flex;
      flex-direction: column;

      gap: 4px;

      margin-bottom: 16px;
    }


    .bar-background {
      width: 100%;
      height: 4px;

      background:
        rgba(255, 255, 255, 0.2);

      border-radius: 2px;

      position: relative;
    }


    .bar-fill {
      height: 100%;

      background: #fff;

      border-radius: 2px;

      width: 0%;

      position: relative;
    }


    .bar-fill::after {
      content: '';

      position: absolute;

      right: -4px;
      top: 50%;

      transform:
        translateY(-50%);

      width: 8px;
      height: 8px;

      background: #fff;

      border-radius: 50%;

      box-shadow:
        0 0 4px rgba(0,0,0,0.5);
    }


    .time-labels {
      display: flex;

      justify-content:
        space-between;

      font-size: 10px;

      color:
        rgba(255, 255, 255, 0.55);

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

      padding: 0 2px;
    }


    button {
      padding: 10px 20px;

      font-size: 12px;

      cursor: pointer;

      border-radius: 20px;

      border: none;

      background: #1db954;

      color: #fff;

      font-weight: 700;
    }

  </style>
</head>


<body>

  <div
    id="content"
    class="widget"
  >
    Loading...
  </div>


  <script>

    /* =========================
       SPOTIFY CONFIG
    ========================== */

    const CLIENT_ID =
      '60acf98167984de5820f1a96728ddce6';


    const REDIRECT_URI =
      'https://burnerlek.github.io/spotifyWEB/';


    const SCOPES =
      'user-read-currently-playing user-read-playback-state';


    /*
      Prevent overlapping requests.
    */

    let isFetching = false;


    /*
      Prevent requests while
      rate limited.
    */

    let rateLimitedUntil = 0;


    /* =========================
       GET AUTHORIZATION CODE
    ========================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      params.get('code');


    /* =========================
       PKCE FUNCTIONS
    ========================== */

    function generateRandomString(length) {

      const possible =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';


      const values =
        crypto.getRandomValues(
          new Uint8Array(length)
        );


      return values.reduce(
        (acc, x) =>
          acc +
          possible[
            x % possible.length
          ],
        ''
      );
    }


    async function sha256(plain) {

      const encoder =
        new TextEncoder();


      const data =
        encoder.encode(plain);


      return window.crypto.subtle.digest(
        'SHA-256',
        data
      );
    }


    function base64encode(input) {

      return btoa(
        String.fromCharCode(
          ...new Uint8Array(input)
        )
      )
      .replace(/=/g, '')
      .replace(/\+/g, '-')
      .replace(/\//g, '_');
    }


    /* =========================
       SPOTIFY LOGIN
    ========================== */

    async function redirectToAuth() {

      console.log(
        'Starting Spotify login...'
      );


      const codeVerifier =
        generateRandomString(64);


      const hashed =
        await sha256(
          codeVerifier
        );


      const codeChallenge =
        base64encode(
          hashed
        );


      /*
        Save this before going
        to Spotify.
      */

      localStorage.setItem(
        'code_verifier',
        codeVerifier
      );


      const authUrl =
        new URL(
          'https://accounts.spotify.com/authorize'
        );


      authUrl.search =
        new URLSearchParams({

          response_type:
            'code',

          client_id:
            CLIENT_ID,

          scope:
            SCOPES,

          code_challenge_method:
            'S256',

          code_challenge:
            codeChallenge,

          redirect_uri:
            REDIRECT_URI

        }).toString();


      window.location.href =
        authUrl.toString();
    }


    /* =========================
       SHOW LOGIN BUTTON
    ========================== */

    function showLogin() {

      const content =
        document.getElementById(
          'content'
        );


      content.innerHTML = `
        <button id="login-button">
          Log in with Spotify
        </button>
      `;


      document
        .getElementById(
          'login-button'
        )
        .addEventListener(
          'click',
          redirectToAuth
        );
    }


    /* =========================
       EXCHANGE LOGIN CODE
       FOR ACCESS + REFRESH TOKEN
    ========================== */

    async function getAccessToken(authCode) {

      const codeVerifier =
        localStorage.getItem(
          'code_verifier'
        );


      console.log(
        'Authorization code received:',
        !!authCode
      );


      console.log(
        'Code verifier exists:',
        !!codeVerifier
      );


      if (!codeVerifier) {

        console.error(
          'No code verifier found.'
        );


        showLogin();

        return false;
      }


      try {

        const response =
          await fetch(
            'https://accounts.spotify.com/api/token',
            {

              method: 'POST',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                new URLSearchParams({

                  client_id:
                    CLIENT_ID,

                  grant_type:
                    'authorization_code',

                  code:
                    authCode,

                  redirect_uri:
                    REDIRECT_URI,

                  code_verifier:
                    codeVerifier

                })

            }
          );


        const data =
          await response.json();


        console.log(
          'Token response:',
          response.status,
          data
        );


        if (!response.ok) {

          console.error(
            'Token exchange failed:',
            data
          );


          showLogin();

          return false;
        }


        /*
          Save access token.
        */

        localStorage.setItem(
          'access_token',
          data.access_token
        );


        /*
          THIS IS THE IMPORTANT PART.

          Save the refresh token so
          we can automatically get
          a new access token later.
        */

        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );


          console.log(
            'Refresh token saved!'
          );

        }


        /*
          We no longer need this
          after successful login.
        */

        localStorage.removeItem(
          'code_verifier'
        );


        console.log(
          'Login successful!'
        );


        /*
          Remove ?code= from URL.
        */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        return true;

      }
      catch (err) {

        console.error(
          'Token exchange error:',
          err
        );


        return false;
      }
    }


    /* =========================
       REFRESH ACCESS TOKEN
    ========================== */

    async function refreshAccessToken() {

      const refreshToken =
        localStorage.getItem(
          'refresh_token'
        );


      if (!refreshToken) {

        console.log(
          'No refresh token found.'
        );


        showLogin();

        return false;
      }


      console.log(
        'Refreshing access token...'
      );


      try {

        const response =
          await fetch(
            'https://accounts.spotify.com/api/token',
            {

              method: 'POST',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                new URLSearchParams({

                  client_id:
                    CLIENT_ID,

                  grant_type:
                    'refresh_token',

                  refresh_token:
                    refreshToken

                })

            }
          );


        const data =
          await response.json();


        console.log(
          'Refresh response:',
          response.status,
          data
        );


        if (!response.ok) {

          console.error(
            'Refresh failed:',
            data
          );


          /*
            The refresh token no
            longer works, so login
            manually again.
          */

          localStorage.removeItem(
            'access_token'
          );


          localStorage.removeItem(
            'refresh_token'
          );


          showLogin();

          return false;
        }


        /*
          Save the new access token.
        */

        localStorage.setItem(
          'access_token',
          data.access_token
        );


        /*
          Sometimes Spotify may
          return a new refresh token.
        */

        if (data.refresh_token) {

          localStorage.setItem(
            'refresh_token',
            data.refresh_token
          );

        }


        console.log(
          'Access token refreshed!'
        );


        return true;

      }
      catch (err) {

        console.error(
          'Refresh error:',
          err
        );


        return false;
      }
    }


    /* =========================
       FORMAT TIME
    ========================== */

    function formatTime(ms) {

      const totalSeconds =
        Math.floor(ms / 1000);


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      return `${minutes}:${
        seconds < 10
          ? '0'
          : ''
      }${seconds}`;
    }


    /* =========================
       SHOW PAUSED SCREEN
    ========================== */

    function showPaused() {

      const content =
        document.getElementById(
          'content'
        );


      content.innerHTML = `

        <div
          class="art-wrapper"
          style="
            background:#1c1c1e;
            display:flex;
            align-items:center;
            justify-content:center;
          "
        >

          <span
            style="
              font-size:42px;
            "
          >
            🎵
          </span>

        </div>


        <div class="track-info">

          <h2>
            Paused
          </h2>

          <p>
            Play a song on Spotify
          </p>

        </div>

      `;
    }


    /* =========================
       FETCH NOW PLAYING
    ========================== */

    async function fetchNowPlaying() {

      /*
        Do not overlap requests.
      */

      if (isFetching) {

        return;
      }


      /*
        Do not request while
        Spotify is rate limiting us.
      */

      if (
        Date.now() <
        rateLimitedUntil
      ) {

        return;
      }


      const token =
        localStorage.getItem(
          'access_token'
        );


      /*
        No access token.

        If we have a refresh token,
        try to get a new one
        automatically.
      */

      if (!token) {

        const refreshToken =
          localStorage.getItem(
            'refresh_token'
          );


        if (refreshToken) {

          const refreshed =
            await refreshAccessToken();


          if (refreshed) {

            fetchNowPlaying();

          }


          return;
        }


        showLogin();

        return;
      }


      isFetching = true;


      try {

        const res =
          await fetch(
            'https://api.spotify.com/v1/me/player/currently-playing',
            {

              headers: {
                Authorization:
                  `Bearer ${token}`
              }

            }
          );


        /* =====================
           RATE LIMITED
        ====================== */

        if (res.status === 429) {

          const retryHeader =
            res.headers.get(
              'Retry-After'
            );


          let retryAfter =
            Number(retryHeader);


          /*
            If Spotify does not give
            us a retry time, wait
            30 seconds.
          */

          if (
            !retryAfter ||
            retryAfter < 5
          ) {

            retryAfter = 30;
          }


          rateLimitedUntil =
            Date.now() +
            retryAfter * 1000;


          console.warn(
            `Rate limited. Waiting ${retryAfter} seconds...`
          );


          return;
        }


        /* =====================
           TOKEN EXPIRED
        ====================== */

        if (res.status === 401) {

          console.log(
            'Access token expired.'
          );


          /*
            Instead of logging in
            again, get a new token
            using the refresh token.
          */

          const refreshed =
            await refreshAccessToken();


          if (refreshed) {

            console.log(
              'Token refreshed. Retrying Spotify request...'
            );


            /*
              Try again with the
              new access token.
            */

            setTimeout(
              fetchNowPlaying,
              100
            );

          }


          return;
        }


        /* =====================
           NOTHING PLAYING
        ====================== */

        if (
          res.status === 204 ||
          res.status === 202
        ) {

          showPaused();

          return;
        }


        /* =====================
           OTHER ERROR
        ====================== */

        if (!res.ok) {

          const errorText =
            await res.text();


          console.error(
            'Spotify API error:',
            res.status,
            errorText
          );


          return;
        }


        /* =====================
           GET SONG DATA
        ====================== */

        const data =
          await res.json();


        /*
          Extra safety check.
        */

        if (!data.item) {

          showPaused();

          return;
        }


        const track =
          data.item;


        const progressMs =
          data.progress_ms || 0;


        const durationMs =
          track.duration_ms;


        const pct =
          (
            (progressMs / durationMs) * 100
          ).toFixed(1);


        const content =
          document.getElementById(
            'content'
          );


        content.innerHTML = `

          <div class="art-wrapper">

            <img
              src="${track.album.images[0].url}"
              alt="Album Art"
            />

          </div>


          <div class="track-info">

            <h2>
              ${track.name}
            </h2>

            <p>
              ${track.artists
                .map(
                  a => a.name
                )
                .join(', ')}
            </p>

          </div>


          <div class="progress-container">

            <div class="bar-background">

              <div
                class="bar-fill"
                style="
                  width: ${pct}%;
                "
              >
              </div>

            </div>


            <div class="time-labels">

              <span>
                ${formatTime(
                  progressMs
                )}
              </span>


              <span>
                -${formatTime(
                  durationMs - progressMs
                )}
              </span>

            </div>

          </div>

        `;

      }
      catch (err) {

        console.error(
          'Now playing error:',
          err
        );

      }
      finally {

        isFetching = false;

      }
    }


    /* =========================
       START APP
    ========================== */

    async function startApp() {

      /*
        We just came back from
        Spotify login.
      */

      if (code) {

        const loggedIn =
          await getAccessToken(
            code
          );


        if (loggedIn) {

          fetchNowPlaying();

        }

      }
      else {

        /*
          Normal startup.
        */

        fetchNowPlaying();

      }


      /*
        IMPORTANT:

        Do NOT poll every second.

        Every second was causing
        the 429 rate limit errors.

        Five seconds is a much
        safer starting point.
      */

      setInterval(
        fetchNowPlaying,
        5000
      );
    }


    startApp();

  </script>

</body>
</html>
