<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%; /* Helper preview for circular display */
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      padding: 24px;
    }

    .art-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 15px rgba(29, 185, 84, 0.2);
    }

    .art-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
    }

    .track-info {
      width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    p {
      font-size: 11px;
      color: #b3b3b3;
      margin: 3px 0 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 10px;
      color: #1db954;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #1db954;
      border-radius: 50%;
      box-shadow: 0 0 8px #1db954;
    }

    button {
      padding: 10px 20px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 20px;
      border: none;
      background: #1db954;
      color: #fff;
      font-weight: 700;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div id="content" class="card">Loading...</div>

  <script>
    const CLIENT_ID = 'YOUR_SPOTIFY_CLIENT_ID_HERE';
    const REDIRECT_URI = 'https://<your-username>.github.io/kraken-spotify/';
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    async function redirectToAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      localStorage.setItem('code_verifier', codeVerifier);

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      }).toString();

      window.location.href = authUrl.toString();
    }

    async function getAccessToken(authCode) {
      const codeVerifier = localStorage.getItem('code_verifier');
      const response = await fetch("https://accounts.spotify.com/api/token", {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: authCode,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('access_token', data.access_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        fetchNowPlaying();
      }
    }

    async function fetchNowPlaying() {
      const token = localStorage.getItem('access_token');
      const content = document.getElementById('content');

      if (!token) {
        content.innerHTML = `<button onclick="redirectToAuth()">Log in with Spotify</button>`;
        return;
      }

      try {
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 204 || res.status === 202) {
          content.innerHTML = `
            <div class="art-wrapper" style="background:#121212; display:flex; align-items:center; justify-content:center;">
              <span style="font-size:32px;">🎵</span>
            </div>
            <div class="track-info">
              <h2>Paused</h2>
              <p>Play a song on Spotify</p>
            </div>
          `;
          return;
        }

        if (res.status === 401) {
          localStorage.removeItem('access_token');
          redirectToAuth();
          return;
        }

        const data = await res.json();
        const track = data.item;
        content.innerHTML = `
          <div class="art-wrapper">
            <img src="${track.album.images[0].url}" alt="Album Art" />
          </div>
          <div class="track-info">
            <h2>${track.name}</h2>
            <p>${track.artists.map(a => a.name).join(', ')}</p>
            <div class="status-badge"><span class="dot"></span> Playing</div>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    if (code) {
      getAccessToken(code);
    } else {
      fetchNowPlaying();
      setInterval(fetchNowPlaying, 3000);
    }
  </script>
</body>
</html>
