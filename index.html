<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kraken Spotify Display</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      padding: 16px;
    }

    /* Fixed Outer Canvas */
    .art-container {
      position: relative;
      width: 155px;
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    /* Static Glowing Spotify Green Outer Ring */
    .art-container::before {
      content: '';
      position: absolute;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: 2px solid rgba(29, 185, 84, 0.4);
      box-shadow: 0 0 12px rgba(29, 185, 84, 0.3);
      z-index: 1;
    }

    /* Vinyl Record Design */
    .disc-wrapper {
      position: relative;
      width: 135px;
      height: 135px;
      border-radius: 50%;
      z-index: 2;
      background: #111;
      /* Concentric vinyl groove reflections */
      box-shadow: 
        0 0 0 2px #222,
        0 0 0 4px #181818,
        0 0 0 8px #282828,
        0 0 0 12px #151515,
        0 8px 24px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Center Album Art Label */
    .disc-wrapper img {
      width: 65%;
      height: 65%;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    /* Spindle Center Hole */
    .disc-wrapper::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: #000;
      border: 2px solid #222;
      border-radius: 50%;
      z-index: 3;
    }

    .track-info {
      width: 82%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    h2 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    p {
      font-size: 11px;
      color: #b3b3b3;
      margin: 3px 0 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button {
      padding: 10px 20px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 20px;
      border: none;
      background: #1db954;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="content" class="card">Loading...</div>

  <script>
    const CLIENT_ID = '60acf98167984de5820f1a96728ddce6';
    const REDIRECT_URI = 'https://burnerlek.github.io/spotifyWEB/';
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    async function redirectToAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      localStorage.setItem('code_verifier', codeVerifier);

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      }).toString();

      window.location.href = authUrl.toString();
    }

    async function getAccessToken(authCode) {
      const codeVerifier = localStorage.getItem('code_verifier');
      const response = await fetch("https://accounts.spotify.com/api/token", {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: authCode,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('access_token', data.access_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        fetchNowPlaying();
      }
    }

    async function fetchNowPlaying() {
      const token = localStorage.getItem('access_token');
      const content = document.getElementById('content');

      if (!token) {
        content.innerHTML = `<button onclick="redirectToAuth()">Log in with Spotify</button>`;
        return;
      }

      try {
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 204 || res.status === 202) {
          content.innerHTML = `
            <div class="art-container">
              <div class="disc-wrapper">
                <span style="font-size:32px;">🎵</span>
              </div>
            </div>
            <div class="track-info">
              <h2>Paused</h2>
              <p>Play a song on Spotify</p>
            </div>
          `;
          return;
        }

        if (res.status === 401) {
          localStorage.removeItem('access_token');
          redirectToAuth();
          return;
        }

        const data = await res.json();
        const track = data.item;

        content.innerHTML = `
          <div class="art-container">
            <div class="disc-wrapper">
              <img src="${track.album.images[0].url}" alt="Album Art" />
            </div>
          </div>
          <div class="track-info">
            <h2>${track.name}</h2>
            <p>${track.artists.map(a => a.name).join(', ')}</p>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    if (code) {
      getAccessToken(code);
    } else {
      fetchNowPlaying();
      setInterval(fetchNowPlaying, 3000);
    }
  </script>
</body>
</html>
