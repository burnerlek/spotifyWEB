<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kraken Spotify Display</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
    }

    .widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      padding: 24px 28px;
    }

    /* iOS Style Rounded Album Art */
    .art-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 20px;
      margin-bottom: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .art-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .track-info {
      width: 85%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    p {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin: 2px 0 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* iOS Style Scrubber Bar */
    .progress-container {
      width: 80%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bar-background {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      width: 0%;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    button {
      padding: 10px 20px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 20px;
      border: none;
      background: #1db954;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="content" class="widget">Loading...</div>

  <script>
    const CLIENT_ID = '60acf98167984de5820f1a96728ddce6';
    const REDIRECT_URI = 'https://burnerlek.github.io/spotifyWEB/';
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    async function redirectToAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      localStorage.setItem('code_verifier', codeVerifier);

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      }).toString();

      window.location.href = authUrl.toString();
    }

    async function getAccessToken(authCode) {
      const codeVerifier = localStorage.getItem('code_verifier');
      const response = await fetch("https://accounts.spotify.com/api/token", {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: authCode,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('access_token', data.access_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        fetchNowPlaying();
      }
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    async function fetchNowPlaying() {
      const token = localStorage.getItem('access_token');
      const content = document.getElementById('content');

      if (!token) {
        content.innerHTML = `<button onclick="redirectToAuth()">Log in with Spotify</button>`;
        return;
      }

      try {
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 204 || res.status === 202) {
          content.innerHTML = `
            <div class="art-wrapper" style="background:#1c1c1e; display:flex; align-items:center; justify-content:center;">
              <span style="font-size:32px;">🎵</span>
            </div>
            <div class="track-info">
              <h2>Paused</h2>
              <p>Play a song on Spotify</p>
            </div>
          `;
          return;
        }

        if (res.status === 401) {
          localStorage.removeItem('access_token');
          redirectToAuth();
          return;
        }

        const data = await res.json();
        const track = data.item;
        const progressMs = data.progress_ms || 0;
        const durationMs = track.duration_ms;
        const pct = ((progressMs / durationMs) * 100).toFixed(1);

        content.innerHTML = `
          <div class="art-wrapper">
            <img src="${track.album.images[0].url}" alt="Album Art" />
          </div>
          <div class="track-info">
            <h2>${track.name}</h2>
            <p>${track.artists.map(a => a.name).join(', ')}</p>
          </div>
          <div class="progress-container">
            <div class="bar-background">
              <div class="bar-fill" style="width: ${pct}%;"></div>
            </div>
            <div class="time-labels">
              <span>${formatTime(progressMs)}</span>
              <span>-${formatTime(durationMs - progressMs)}</span>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    if (code) {
      getAccessToken(code);
    } else {
      fetchNowPlaying();
      setInterval(fetchNowPlaying, 1000); // Polls every second to keep progress smooth
    }
  </script>
</body>
</html>
